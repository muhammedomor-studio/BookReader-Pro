<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>BookReader Pro</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>

  <header class="glass" style="padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; z-index: 20;">
    <div style="display:flex; align-items:center; gap:8px;">
      <i class="fa-solid fa-bolt" style="color:var(--accent); font-size:20px;"></i>
      <h1 style="font-size:16px; font-weight:800;">BookReader <span style="color:var(--accent);">PRO</span></h1>
    </div>
    <button id="btn-add-modal" class="btn-accent"><i class="fa-solid fa-plus"></i> Add Book</button>
  </header>

  <main style="flex:1; overflow-y:auto; padding:16px;">
    <div id="books-grid" class="grid-books"></div>
  </main>

  <!-- READER MODAL -->
  <div id="reader-modal" class="hidden">
    <div class="glass" style="padding:10px 14px; display:flex; justify-content:space-between; align-items:center; z-index:40;">
      <button id="btn-close-reader" style="background:none; border:none; color:white; font-size:16px; cursor:pointer;"><i class="fa-solid fa-arrow-left"></i></button>
      <h2 id="reader-title" style="font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></h2>
      <button id="reader-tts-btn" style="background:none; border:none; color:var(--accent); font-size:16px; cursor:pointer;"><i class="fa-solid fa-headphones"></i></button>
    </div>

    <div style="flex:1; position:relative; overflow:hidden;">
      <div id="flipbook-mount" style="width:100%; height:100%;"></div>
    </div>

    <div class="glass" style="padding:8px 16px; font-family:monospace; font-size:11px; text-align:center;">
      <span id="reader-pages-indicator">Page 1</span>
    </div>
  </div>

  <!-- UPLOAD MODAL -->
  <div id="upload-modal" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:80; display:flex; align-items:center; justify-content:center; padding:16px;">
    <div class="glass" style="width:100%; max-width:380px; padding:20px; border-radius:16px;">
      <h3 style="font-size:16px; margin-bottom:12px;">Add Book (PDF)</h3>
      <input type="file" id="file-input" accept="application/pdf" style="width:100%; margin-bottom:12px;" />
      <input type="text" id="title-input" placeholder="Title" class="glass" style="width:100%; padding:8px; border-radius:8px; color:white; margin-bottom:14px; outline:none;" />
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button id="btn-cancel-upload" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">Cancel</button>
        <button id="btn-save-pdf" class="btn-accent">Save</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
